.lk-d .sheet:not(.plus) .tlab{background:var(--h-soft);border-radius:14px;min-height:46px}
.lk-d .sheet:not(.plus) .btn{border-radius:999px;padding:14px;font-weight:600}
.lk-d .sheet:not(.plus) .btn.red{background:var(--danger);color:var(--onred)}
.lk-d .sheet:not(.plus) .ghost{border:1.5px solid var(--g-ac);color:var(--g-dk);border-radius:999px;font-weight:500}
.lk-d .sheet:not(.plus) .ghost.dg{border-color:var(--danger);color:var(--danger)}
.lk-d .sheet:not(.plus) .link{color:var(--g-dk);font-weight:500}
.lk-d .sheet:not(.plus) .err{border-radius:14px}
.lk-d .sheet:not(.plus) .prow{border:0;border-radius:22px;background:var(--k-g-bg);padding:12px}
.lk-d .sheet:not(.plus) .prow .ico{width:44px;height:44px;border-radius:50%;background:var(--h-card)}
.lk-d .sheet:not(.plus) .prow b{font-weight:600}
.lk-d .sheet:not(.plus) .prow small{color:var(--h-sub)}
.lk-d .sheet:not(.plus) .prow .gochev{width:32px;height:32px;border-radius:50%;background:var(--h-card);display:flex;align-items:center;justify-content:center;color:var(--g-dk)}
.lk-d .sheet:not(.plus) .opt{border-color:var(--h-ring)}

/* Календарь: зелёный фон под числами, белая шторка с зелёным свечением сверху (D-89) */
.lk-d .tab.calt{background:var(--g-bg)}
.lk-d .calt .cvg{background:transparent;margin:10px 6px 0;padding:0}
.lk-d .calt .cvhd i{background:var(--g-ac);width:64px}
.lk-d .calt .cvl{background:radial-gradient(circle at 105% -4%,var(--h-glow2),transparent 40%),var(--h-page);border-radius:30px 30px 0 0;box-shadow:0 -6px 24px rgba(46,58,43,.06);padding:22px 16px 104px}

/* Правки 11.11 (D-90) */
/* 1. убраны полупрозрачные кружки в углах карточек */
.lk-d .t-home .tile::after,.lk-d .t-home .info::after,.lk-d .t-chk .rc::after,.lk-d .calt .cvc::after,.lk-d .s-pfx .pcard::after,.lk-d .t-art .cover::before{display:none}
.lk-d .t-home .sqc .dec circle{display:none}
/* 2. заголовки вкладок одного размера */
.lk-d .t-chk .top h2,.lk-d .t-art .top h2,.lk-d .calt .cvt .d{font-size:22px;font-weight:600}
.lk-d .t-chk .top h2::after,.lk-d .t-art .top h2::after{width:13px;height:13px}
/* 3. Календарь: больше воздуха в строке недели и в месяце (шторка в месячном виде ниже) */
.lk-d .calt .cvg .dn{padding:8px 0 10px}
.lk-d .calt .cvg .cvd{padding:8px 0 12px}
.lk-d .calt .cvg .cvn:not(.h){height:41px;padding-top:8px}
/* 4–6. плашки: названия тоньше, в развёрнутых цветная полоска слева */
.lk-d .calt .cvc{padding-left:30px}
.lk-d .calt .cvc::before{display:block;left:16px;top:16px;bottom:16px;width:2.5px;border-radius:2px}
.lk-d .calt .cvc .tt{font-weight:500}
.lk-d .calt .cvl.cmp .cvc{padding-left:12px}
.lk-d .calt .cvl.cmp .cvc::before{display:none}
.lk-d .calt .cvl.cmp .cvc .tt{font-weight:400}

/* Правки 11.11, вторая порция (D-91) */
/* заголовки всех экранов одного размера, как «Чекап» */
.lk-d [data-n=notifs] .bar>div>span{font-size:22px!important}
.lk-d :is([data-n=medCard],[data-n=evCard],[data-n=form],[data-n=review],[data-n=load],[data-n=saved],[data-n=fail],[data-n=notifs],[data-n=meas],[data-n=sym],[data-n=symH],[data-n=q],[data-n=qShow],[data-n=qArch],[data-n=move],[data-n=ctr],[data-n=mvHist],[data-n=ctHist],[data-n=fruit],[data-n=kg],[data-n=kgRun],[data-n=br],[data-n=brRun],[data-n=yg],[data-n=ygRun],[data-n=exTime],[data-n=sg],[data-n=sgSet],[data-n=sgDoc],[data-n=sgTime],[data-n=trkSoon]) .h2,.lk-d .s-pfx .h2,.lk-d .s-pfx .phead b{font-size:22px}
.lk-d :is([data-n=meas],[data-n=sym],[data-n=symH],[data-n=q],[data-n=qShow],[data-n=qArch],[data-n=move],[data-n=ctr],[data-n=mvHist],[data-n=ctHist],[data-n=fruit],[data-n=kg],[data-n=kgRun],[data-n=br],[data-n=brRun],[data-n=yg],[data-n=ygRun],[data-n=exTime],[data-n=sg],[data-n=sgSet],[data-n=sgDoc],[data-n=sgTime],[data-n=trkSoon]) .h2::after{width:13px;height:13px}
.lk-d [data-n=notifs] .bar>div>span::after{width:13px;height:13px}
/* Календарь: свёрнутые плашки тоже с полоской */
.lk-d .calt .cvl.cmp .cvc{padding-left:24px}
.lk-d .calt .cvl.cmp .cvc::before{display:block;left:12px;top:9px;bottom:9px}
/* Календарь: месяц слева, с искоркой, как заголовки Чекапа и Статей; стрелки справа */
.lk-d .calt .cvh{display:flex;align-items:center;gap:8px;padding:16px 16px 0}
.lk-d .calt .cvh .cvt{order:0;flex:1;text-align:left}
.lk-d .calt .cvh .ar{order:1;width:36px;height:36px;margin:0;font-size:18px}
.lk-d .calt .cvh .ar:last-child{order:2}
.lk-d .calt .cvt .d{display:inline-flex;align-items:center;gap:8px;margin:0;line-height:1.25}
.lk-d .calt .cvt .d::after{content:"";width:13px;height:13px;background:var(--h-spark);-webkit-mask:var(--spk) center/contain no-repeat;mask:var(--spk) center/contain no-repeat}
/* «Это безопасно?» и другие списки статей: заголовок как у «Чекапа», значки в белой обводке */
.lk-d .t-art .art h2[style]{font-size:22px;display:flex;align-items:center;gap:8px}
.lk-d .t-art .art h2[style]::after{content:"";width:13px;height:13px;background:var(--h-spark);-webkit-mask:var(--spk) center/contain no-repeat;mask:var(--spk) center/contain no-repeat}
.lk-d .t-art .prow .ico{box-shadow:0 0 0 3px var(--h-card)}
/* Главная: значения на плитках меньше */
.lk-d .t-home .focus .tile .v,.lk-d .t-home .focus .col:first-child .tile:nth-child(odd) .v,.lk-d .t-home .focus .col:last-child .tile:nth-child(even) .v{font-size:20px}

/* Правки 11.11, третья порция (D-92) */
.lk-d [data-n=notifs] .nrow,.lk-d [data-n=notifs] .nrow:has(.dot){align-items:flex-start;background:transparent;box-shadow:none;border-radius:0;padding:4px 0 14px;margin-bottom:10px;border-bottom:.5px solid var(--h-ring)}
.lk-d [data-n=notifs] .dot{border-color:var(--h-page)}
.lk-d [data-n=notifs] .n .tm{background:var(--h-soft)}
.lk-d .s-pfx .pcard .big{font-size:20px}
.lk-d .t-art .ver{color:var(--g-ac);font-weight:600}
.lk-d .t-art .art .meta .mtag{background:var(--h-soft)}
.lk-d .t-art .art h2:not([style]){margin-bottom:8px}

/* Правки 11.11, четвёртая порция (D-93) */
/* названия статей переносятся обычно, без «выравнивания» строк */
.lk-d .t-art .art h2,.lk-d .t-art .acb h3,.art h2{text-wrap:wrap}
/* срок на карточке статьи: обычная толщина, ярко-зелёный */
.lk-d .t-art .ver{color:var(--h-bright);font-weight:400}
/* Сравнение показателей: зелёная полоска слева, при раскрытии превращается в точку */
.lk-d .t-chk .ph{position:relative;padding-left:28px}
.lk-d .t-chk .ph::before{content:"";position:absolute;left:14px;top:14px;bottom:14px;width:4px;border-radius:2px;background:var(--g-ac);transition:top .2s,bottom .2s}
.lk-d .t-chk .plate.open .ph::before{top:calc(50% - 2px);bottom:calc(50% - 2px)}
@media (prefers-reduced-motion:reduce){.lk-d .t-chk .ph::before{transition:none}}
/* «Данные сохранены»: большая галочка зелёная */
.lk-d [data-n=saved] .done .ok{background:var(--g-chk);color:var(--g-ac)}

/* «Данные сохранены» шторкой (D-94) */
.sheet.saved .done{flex:none;padding:2px 2px 4px}
.sheet.saved .done h2{margin-bottom:14px}
.lk-d .sheet.saved{--blue-b:var(--k-g-bg);--blue-f:var(--g-dk);--violet-b:var(--k-p-bg);--violet-f:var(--k-p-lb);--green-b:var(--k-b-bg);--green-f:var(--k-b-lb)}
.lk-d .sheet.saved .done .ok{width:64px;height:64px;font-size:30px;background:var(--g-chk);color:var(--g-ac);box-shadow:0 0 0 9px var(--h-ring),0 0 0 18px var(--h-ring2);margin:14px auto 26px}
.lk-d .sheet.saved .done h2{font-size:22px;font-weight:600;text-align:center}
.lk-d .sheet.saved .rowd{border-color:var(--h-ring)}
.lk-d .sheet.saved .rowd .ico{border-radius:50%;width:36px;height:36px}

/* Поля «Сверьте с документом» и «Не получилось прочитать» (D-95), оба стиля */
.fq{border-radius:12px;background:var(--wb);border-left:3px solid var(--wl);padding:10px 12px;margin:6px 0}
.fqh{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.fqh .k{font-size:12px;color:var(--t2)}.fqh .k small{color:var(--t3);font-size:11px}
.fqt{font-size:12px;font-weight:500;color:var(--wf)}
.fqv{font-size:17px;font-weight:600;margin:4px 0 2px}
.fqb{display:flex;gap:8px;margin-top:8px}
.fqb button{flex:1;text-align:center;font-size:13px;font-weight:500;padding:8px;border-radius:10px;border:.5px solid var(--bds);background:var(--s2)}
.fqb button.on{background:var(--fill);color:var(--onfill);border-color:var(--fill)}
.lk-d [data-n=review] .fq{background:var(--k-y-bg);border-left:0;border-radius:18px;padding:12px 14px 12px 26px;position:relative}
.lk-d [data-n=review] .fq::before{content:"";position:absolute;left:12px;top:14px;bottom:14px;width:3px;border-radius:2px;background:var(--k-y-ln)}
.lk-d [data-n=review] .fqt{color:var(--k-y-lb)}
.lk-d [data-n=review] .fqh .k{color:var(--h-sub)}
.lk-d [data-n=review] .fqv{color:var(--h-ink)}
.lk-d [data-n=review] .fqb button{border:0;border-radius:999px;background:var(--h-card);padding:10px}
.lk-d [data-n=review] .fqb button.on{background:var(--g-ac);color:var(--g-onac)}
.lk-d [data-n=review] .hintc{color:var(--k-y-lb)}

/* Поля проверки: белый фон блока (D-95) */
.lk-d [data-n=review] .fq{background:var(--h-card);box-shadow:0 0 0 1px var(--h-ring)}
.lk-d [data-n=review] .fqb button:not(.on){background:var(--h-soft)}
/* ===== ЧЕРНОВИК: первый вход (D-96) ===== */
.lk-d .ob{background:radial-gradient(circle at 105% -4%,var(--h-glow2),transparent 42%),var(--h-page);color:var(--h-ink);padding:28px 20px calc(20px + env(safe-area-inset-bottom,0px));
 --ac:var(--g-ac);--acl:var(--g-dk);--acbg:var(--g-chk);--fill:var(--g-ac);--onfill:var(--g-onac)}
.lk-d .ob .mascot{width:92px!important;height:92px;margin:22px auto 0;border-radius:50%;background:radial-gradient(circle at 35% 30%,var(--h-card),var(--g-chk));color:var(--g-ac);font-size:40px;box-shadow:0 0 0 10px var(--h-ring),0 0 0 20px var(--h-ring2)}
.lk-d .ob h1{display:flex;align-items:center;gap:10px;font-size:30px;font-weight:600;letter-spacing:-.01em;margin:30px 0 8px;color:var(--h-ink)}
.lk-d .ob h1::after{content:"";width:16px;height:16px;flex:none;background:var(--h-spark);-webkit-mask:var(--spk) center/contain no-repeat;mask:var(--spk) center/contain no-repeat}
.lk-d .ob p{color:var(--h-sub);font-size:15px}
.lk-d .ob .proto{border:0;background:var(--h-soft);border-radius:20px;padding:14px 16px;color:var(--h-sub);font-size:13px}
.lk-d .ob .proto b{color:var(--h-ink)}
.lk-d .ob .ck{align-items:flex-start;gap:12px;padding:8px 0 10px;font-size:13.5px;color:var(--h-ink);line-height:1.4}
.lk-d .ob .ck .bx{width:24px;height:24px;border-radius:8px;border-color:var(--g-ac)}
.lk-d .ob .btn{border-radius:999px;padding:15px;font-weight:600;font-size:15px}
.lk-d .ob .btn[disabled]{background:var(--h-soft);color:var(--h-sub)}
.lk-d .ob .link{color:var(--g-dk);font-weight:500}
.lk-d .ob .err{border-radius:14px}
.lk-d .ob .bk{width:44px;height:44px;border-radius:50%;background:var(--h-card);box-shadow:var(--h-shadow);justify-content:center;font-size:0;color:var(--h-ink)}
.lk-d .ob .bk .ic{font-size:20px}
.lk-d .ob .opt{border:0;background:var(--h-soft);border-radius:18px;padding:15px 14px;margin-bottom:8px;font-size:15px;color:var(--h-ink)}
.lk-d .ob .opt.on{background:var(--g-ac);color:var(--g-onac);box-shadow:none;font-weight:500}
.lk-d .ob .rd{background:var(--h-card);border-color:var(--h-ring)}
.lk-d .ob .opt.on .rd{border-color:transparent;background:var(--h-card)}
.lk-d .ob .f label{color:var(--h-sub);font-size:12px;margin-bottom:5px}
.lk-d .ob .in{border:0;background:var(--h-soft);border-radius:14px;min-height:48px;padding:12px 14px}

/* Правки 11.11 (D-97) */
.lk-d .ob .opt.on{background:color-mix(in srgb,var(--g-ac) 45%,var(--h-soft));color:var(--h-ink);font-weight:400}
/* кольцо вокруг значка — бледный оттенок цвета самого значка */
.lk-d .ch .ico{box-shadow:0 0 0 7px color-mix(in srgb,currentColor 13%,transparent)!important}
.lk-d [data-n=review] .card .ch .ico{box-shadow:none!important}
/* полоска показателя как в Календаре, названия тоньше */
.lk-d .t-chk .ph::before{width:2.5px;border-radius:2px}
.lk-d .t-chk .plate.open .ph::before{top:calc(50% - 1.25px);bottom:calc(50% - 1.25px)}
.lk-d .t-chk .ph .pn{font-weight:500}
/* «Удалить мои данные» на светло-розовой плашке */
.lk-d .s-pfx .list:has(.li.del){background:var(--k-p-bg)}
.lk-d .s-pfx .li.del>.ic{background:var(--h-card)}

/* Правки 13.11 (D-98) */
.avbig{display:flex;justify-content:center;margin:12px 0 6px}
.avt{flex-direction:column;gap:4px}.avt small{font-size:10.5px;color:var(--t3)}
.lk-d .s-pfx .avbig{margin:18px 0 14px}
.lk-d .s-pfx .avbig .avc{box-shadow:0 0 0 8px var(--h-ring),0 0 0 16px var(--h-ring2)}
.lk-d .s-pfx .avt,.lk-d .s-pfx .avt.on{border:0;background:none;border-radius:0;padding:6px 0}
.lk-d .s-pfx .avt .avc{transition:box-shadow .15s}
.lk-d .s-pfx .avt.on .avc{box-shadow:0 0 0 3px var(--h-page),0 0 0 5px var(--g-ac)}
.lk-d .s-pfx .avt small{color:var(--h-sub)}
.lk-d .s-pfx .li{font-size:14px}
.lk-d .calt .cvh .ar{color:var(--h-ink)}
@media (prefers-reduced-motion:reduce){.lk-d .s-pfx .avt .avc{transition:none}}

/* Правки 13.11, вторая порция (D-99) */
.avbig+.grp,.avbig+.grp+.avgrid+.grp{border-top:.5px solid var(--bd);padding-top:14px}
.lk-d .s-pfx .avbig{margin:30px 0 32px}
.lk-d .s-pfx .avbig+.grp,.lk-d .s-pfx .avbig+.grp+.avgrid+.grp{border-top:1px solid var(--h-ring);padding-top:20px;margin-top:20px}
.lk-d [data-n=notifs] .nrow,.lk-d [data-n=notifs] .nrow:has(.dot){border-bottom:0;padding-bottom:8px;margin-bottom:8px}
.lk-d [data-n=notifs] .body>.grp:not(:first-child){border-top:1px solid var(--h-ring);padding-top:20px;margin-top:14px}

/* Правки 13.11, третья порция (D-100) */
.lk-d .s-pfx .avbig+.grp+.avgrid+.grp{margin-top:8px}
.lk-d .t-chk .rc .rn{font-size:15.5px;font-weight:500}
.lk-d .sheet:not(.plus) .link,.lk-d :is([data-n=sym],[data-n=q]) .link{font-weight:400;text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1px}
.lk-d :is([data-n=move],[data-n=ctr]) .big-tap{margin:56px auto 34px}
.lk-d :is([data-n=move],[data-n=ctr]) .timer{margin-top:18px}

/* «+» без заголовков, высота по содержимому (D-101) */
.sheet.plus.st-main{height:auto}
.sheet.plus .pgap{height:12px}
.lk-d .sheet.plus.st-main{height:auto;padding-bottom:114px}
.lk-d .sheet.plus.st-main .prow:last-child{margin-bottom:0}

/* Формы «Добавить событие» и «Добавить результат» с выбором типа (D-102) */
.tsel{display:flex;flex-wrap:wrap;gap:6px;margin:2px 0 14px}
.tsel .chip{font-size:13px;padding:7px 12px}
.tchips{display:flex;flex-wrap:wrap;gap:6px;margin:-4px 0 12px}.tchips .chip{font-size:12px;padding:5px 10px}
.scanhint{display:block;width:100%;text-align:left}
.vrow{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) auto;gap:8px;align-items:end}
.vrow .vrm{position:static;margin-bottom:18px}
.lk-d [data-n=form] .tsel .chip{border:0;background:var(--h-soft);color:var(--h-ink)}
.lk-d [data-n=form] .tsel .chip.on.c-b{background:var(--k-b-bg);color:var(--k-b-lb);box-shadow:inset 0 0 0 1.5px var(--k-b-ln)}
.lk-d [data-n=form] .tsel .chip.on.c-p{background:var(--k-p-bg);color:var(--k-p-lb);box-shadow:inset 0 0 0 1.5px var(--k-p-ln)}
.lk-d [data-n=form] .tsel .chip.on.c-v{background:var(--k-v-bg);color:var(--k-v-lb);box-shadow:inset 0 0 0 1.5px var(--k-v-ln)}
.lk-d [data-n=form] .tsel .chip.on.c-y{background:var(--k-y-bg);color:var(--k-y-lb);box-shadow:inset 0 0 0 1.5px var(--k-y-ln)}
.lk-d [data-n=form] .tsel .chip.on{font-weight:500}
.lk-d [data-n=form] .tchips .chip{border:0;background:var(--h-card);box-shadow:0 0 0 1px var(--h-ring);color:var(--h-sub)}
.lk-d [data-n=form] .vrow .vrm{background:var(--h-soft);border:0;width:30px;height:30px}

/* Заголовок форм под кнопкой «назад», как на других экранах (D-103) */
[data-n=form] .bar{flex-direction:column;align-items:flex-start;gap:12px}
.lk-d [data-n=form] .bar{font-size:22px;font-weight:600;padding-bottom:12px}

/* «Другое», цвета событий, единицы (D-104) */
.adrow{border-bottom:0;padding:4px 0 10px}
.colsel{display:flex;gap:12px;padding:4px 0}
.colb{width:34px;height:34px;border-radius:50%;border:0;transition:box-shadow .15s}
.colb.on{box-shadow:0 0 0 3px var(--s2),0 0 0 5px var(--t1)}
.lk-d .colb.on{box-shadow:0 0 0 3px var(--h-page),0 0 0 5px var(--g-ac)}
.cb-y{background:var(--k-y-ln)}.cb-o{background:var(--k-o-ln)}.cb-t{background:var(--k-t-ln)}.cb-s{background:var(--k-s-ln)}
.cvc.t{--k-bg:var(--k-t-bg);--k-ln:var(--k-t-ln);--k-lb:var(--k-t-lb);--k-sb:var(--k-t-sb)}
.cvc.s{--k-bg:var(--k-s-bg);--k-ln:var(--k-s-ln);--k-lb:var(--k-s-lb);--k-sb:var(--k-s-sb)}

(function(){var dr=null,moved=false;
 phone.addEventListener('pointerdown',function(ev){if(ev.pointerType!='mouse')return;var s=ev.target.closest('[data-drag]');if(s){dr={el:s,x:ev.clientX,l:s.scrollLeft};moved=false}});
 window.addEventListener('pointermove',function(ev){if(!dr)return;var dx=ev.clientX-dr.x;if(Math.abs(dx)>5){moved=true;dr.el.style.scrollSnapType='none'}if(moved)dr.el.scrollLeft=dr.l-dx});
 window.addEventListener('pointerup',function(){if(dr){dr.el.style.scrollSnapType='';dr=null}});
 phone.addEventListener('click',function(ev){if(moved){moved=false;ev.stopPropagation();ev.preventDefault()}},true);

(function(){var gy=null,gEl=null;
 phone.addEventListener('pointerdown',function(e){var g=e.target.closest('[data-grab]');if(g){gy=e.clientY;gEl=g}});
 window.addEventListener('pointerup',function(e){if(gy==null)return;var dy=e.clientY-gy,y=gy,el=gEl;gy=null;gEl=null;var a=el.getAttribute('data-grab').split('|'),act=a[0],arg=a[1];
  if(act=='calMonthV'){if(dy>24)A.calMonthV();return}
  if(act=='calWeekV'){if(dy<-24)A.calWeekV();return}
  if(act=='closeSheet'){if(dy>30)closeSheet();return}
  if(dy>30){closeSheet();return}
  A[act](arg)});
 var pd=0,pz=1,drag=false,lx=0,ly=0,lastTap=0,cur=-1,lastT=0;
 function idx(t){var f=t.closest&&t.closest('.vframe');return f&&!t.closest('.vzb')?+f.getAttribute('data-pg'):-1}
 function dist(t){var a=t[0].clientX-t[1].clientX,b=t[0].clientY-t[1].clientY;return Math.sqrt(a*a+b*b)}
 phone.addEventListener('touchstart',function(e){var i=idx(e.target);if(i<0)return;cur=i;if(e.touches.length==2){pd=dist(e.touches);pz=UI.zs[i].z;drag=false}else if(e.touches.length==1){drag=true;lx=e.touches[0].clientX;ly=e.touches[0].clientY}},{passive:true});
 phone.addEventListener('touchmove',function(e){if(cur<0||!UI.zs||!UI.zs[cur])return;var z=UI.zs[cur];if(e.touches.length==2&&pd){e.preventDefault();z.z=pz*dist(e.touches)/pd;applyZ(cur)}else if(e.touches.length==1&&drag&&z.z>1){e.preventDefault();z.px+=e.touches[0].clientX-lx;z.py+=e.touches[0].clientY-ly;lx=e.touches[0].clientX;ly=e.touches[0].clientY;applyZ(cur)}},{passive:false});
 phone.addEventListener('touchend',function(e){if(cur<0)return;if(e.touches.length<2)pd=0;if(!e.touches.length){drag=false;var n=Date.now();lastT=n;var z=UI.zs&&UI.zs[cur];if(z&&n-lastTap<300){z.z=z.z>1?1:2.5;applyZ(cur);lastTap=0}else lastTap=n}});
 phone.addEventListener('dblclick',function(e){var i=idx(e.target);if(i<0||Date.now()-lastT<800)return;var z=UI.zs[i];z.z=z.z>1?1:2.5;applyZ(i)});
})();
